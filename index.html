<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шпаргалка реализатора | Соната-Крым</title>
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: #f7f4ef;
  color: #1e1e1e;
  line-height: 1.65;
  font-size: 15px;
}

/* ===== LAYOUT ===== */
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

/* ===== HEADER ===== */
.header {
  background: linear-gradient(135deg, #1a3a5c 0%, #2a5a7c 100%);
  color: #fff;
  padding: 28px 0 24px;
  border-bottom: 4px solid #d4a843;
}
.header .wrap { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
.header h1 span { color: #d4a843; }
.header .sub { font-size: 14px; opacity: 0.85; margin-top: 2px; }
.header .badge {
  background: #d4a843; color: #1a3a5c; padding: 6px 18px; border-radius: 20px;
  font-weight: 700; font-size: 13px; white-space: nowrap;
}

/* ===== NAV / CATEGORIES ===== */
.cat-nav {
  background: #fff; border-bottom: 1px solid #e0d8cf; position: sticky; top: 0; z-index: 50;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.cat-nav .wrap {
  display: flex; flex-wrap: wrap; gap: 4px; padding-top: 10px; padding-bottom: 10px;
}
.cat-nav button {
  background: transparent; border: 1px solid #d0c8bc; border-radius: 20px; padding: 5px 14px;
  font-size: 12.5px; cursor: pointer; color: #555; transition: all 0.15s; white-space: nowrap;
}
.cat-nav button:hover { border-color: #1a3a5c; color: #1a3a5c; }
.cat-nav button.active { background: #1a3a5c; color: #fff; border-color: #1a3a5c; }

/* ===== MAIN: SIDEBAR + CONTENT ===== */
.main { display: flex; gap: 28px; padding-top: 24px; padding-bottom: 60px; align-items: flex-start; }

/* ===== SIDEBAR (кнопки экскурсий) ===== */
.sidebar {
  flex: 0 0 280px; position: sticky; top: 62px; max-height: calc(100vh - 80px); overflow-y: auto;
  background: #fff; border-radius: 10px; border: 1px solid #e8e0d6; padding: 14px 10px;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
.sidebar-title {
  font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #999;
  padding: 0 8px 8px; border-bottom: 1px solid #eee; margin-bottom: 6px;
}
.sidebar button {
  display: block; width: 100%; text-align: left; background: transparent; border: none;
  border-radius: 6px; padding: 8px 10px; font-size: 13px; cursor: pointer; color: #333;
  transition: all 0.12s; line-height: 1.3;
}
.sidebar button:hover { background: #f0ebe4; }
.sidebar button.active { background: #e8f0f7; color: #1a3a5c; font-weight: 600; }
.sidebar button .cat-tag {
  display: inline-block; font-size: 10px; background: #eee; color: #777; border-radius: 4px;
  padding: 1px 6px; margin-left: 4px;
}

/* ===== CONTENT ===== */
.content {
  flex: 1; min-width: 0;
}
.content-placeholder {
  background: #fff; border-radius: 10px; border: 1px solid #e8e0d6; padding: 80px 40px; text-align: center;
  color: #aaa; font-size: 16px;
}
.content-placeholder strong { color: #888; }

/* ===== EXCURSION CARD ===== */
.card {
  background: #fff; border-radius: 10px; border: 1px solid #e8e0d6; padding: 32px 36px; display: none;
}
.card.visible { display: block; animation: fadeUp 0.25s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.card h2 { font-size: 24px; font-weight: 700; margin-bottom: 20px; line-height: 1.3; color: #1a3a5c; }
.card .meta {
  display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; padding-bottom: 18px;
  border-bottom: 2px solid #f0ebe4; font-size: 13px; color: #666;
}
.card .meta span { background: #f5f1ec; padding: 4px 12px; border-radius: 16px; }

.card h3 {
  font-size: 17px; font-weight: 600; margin: 28px 0 10px; color: #1e3a5c; padding-bottom: 4px;
  border-bottom: 1px solid #eee;
}
.card h3:first-of-type { margin-top: 0; }
.card p { margin-bottom: 12px; }
.card ul, .card ol { margin-bottom: 14px; padding-left: 22px; }
.card li { margin-bottom: 5px; }
.card li strong { color: #1a3a5c; }
.card blockquote {
  border-left: 4px solid #d4a843; background: #faf8f5; padding: 12px 18px; margin: 16px 0;
  border-radius: 0 6px 6px 0; font-style: italic; color: #444;
}
.card .highlight {
  background: #fef9e7; border-left: 4px solid #d4a843; padding: 12px 18px; margin: 16px 0; border-radius: 0 6px 6px 0;
}
.card .highlight strong { color: #b8860b; }

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .main { flex-direction: column; }
  .sidebar { flex: none; width: 100%; position: static; max-height: none; }
  .card { padding: 20px; }
  .header .wrap { flex-direction: column; text-align: center; }
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <div class="wrap">
    <div>
      <h1>🗂️ Шпаргалка <span>реализатора</span></h1>

</div>

    <button data-cat="semejnye">🐾 Семейные</button>
    <button data-cat="fototur">📸 Фототуры</button>
  </div>
</div>

<!-- ===== MAIN ===== -->
<div class="main wrap">

  <!-- SIDEBAR (кнопки экскурсий) -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-title">📋 Экскурсии</div>

  <!-- CONTENT (описание) -->

    <div class="content-placeholder" id="placeholder">
      <div style="font-size: 48px; margin-bottom: 16px;">👆</div>
      <strong>Выберите экскурсию</strong> из списка слева,<br>чтобы увидеть полное описание, фишки и рекомендации
    </div>
    <!-- карточки генерируются JS -->
  </div>

</div>

<script>
// ===== ДАННЫЕ =====
const excursions = [];

function add(id, title, cat, emoji, data) {
  excursions.push({ id, title, cat, emoji, ...data });
}

// ===== ЮГО-ВОСТОЧНЫЙ КРЫМ (Наташа) =====

add('automorskoy', 'Автоморской Карадаг', 'yugo-vostok', '🚢', {
  time: '⏰ 14:00–18:30 · Полдня (4–4.5 ч)',
  price: '💰 1600–1700₽ · При группе ~1400₽',
  type: '🌊 Морская + пешеходная',
  desc: `<p>Экскурсия из двух частей: сначала — морское путешествие на катере вдоль древнего потухшего вулкана Карадаг, а затем — подъём на гору Узун-Сырт, где зарождалась советская авиация и космонавтика. Два часа в море, час на горе — и полное ощущение, что побывал в трёх разных мирах.</p>`,

  why: `<p>«<strong>Самая ближайшая и самая уникальная экскурсия</strong>», — говорит Наташа. Карадаг — единственный вулкан Крыма, извергавшийся 165 миллионов лет назад. Его разорвало на три части: две трети ушли в море, одна осталась на поверхности.</p>
<p>Капитаны катера — отдельный вид искусства: «Поют песни, рассказывают стихи, с юмором ведут экскурсию». Это не просто трансфер, а настоящее морское шоу.</p>
<p>Гора Узун-Сырт — место, где 17-летний Сергей Королёв запускал свои первые планеры, а 88 космонавтов приезжали «за благословением» перед полётом. Это прикосновение к истории покорения неба.</p>
<p>«Всего 150 км по кругу — а вы увидите море, горы, вулкан, легенды и место, где начиналась космонавтика». Идеально для тех, кто хочет максимум впечатлений за полдня.</p>`,

  hooks: `<ol>
<li><strong>Карадаг</strong> — потухший вулкан. Геродот писал, что в гроте Грохочищем находился вход в Аид. Скалы носят имена: Иван-разбойник, Король, Королева и их свита.</li>
<li><strong>Сердоликовая бухта</strong> — в скалах прожилки настоящего сердолика.</li>
<li><strong>Золотые ворота</strong> — катер проходит прямо под ними. Маленький катер — проходит, большой — нет. Маленький лучше.</li>
<li><strong>Карадагский змей</strong> — легенда у подножия вулкана. Наташа: «Был мужчина в группе, участвовал в научной экспедиции — искали змея. Сети рвались, звуки записывали, еда пропадала, а его так и не видели. Параллельный мир».</li>
<li><strong>Купание в открытом море</strong> — только для взрослых, с борта катера. Чайки, дельфины.</li>
<li><strong>Узун-Сырт</strong> (ныне гора Клементьевская). История: внук Айвазовского Арциулов гулял с Волошиным, тот читал стихи, от восторга подбросили шляпу — и заметили, что она планирует, а не падает. Так открыли воздушные потоки.</li>
<li>С 1923 по 1935 — <strong>11 всесоюзных слётов</strong> планеристов. Антонов, Лавочкин, Илюшин, 17-летний Королёв.</li>
<li><strong>Ротонда «Звёздопад воспоминаний»</strong> — в августе звёздопады. Гора — одно из двух мест в мире (второе — Аризона), где безопасно летать на дельтапланах. 500+ жертв, тем не менее.</li>
<li><strong>Музей воздухоплавания и космонавтики</strong> + памятник той самой соломенной шляпе.</li>
</ol>`,

  sell: `<blockquote>«Хотите за полдня оказаться сразу в двух легендах? Садитесь на катер — два часа вдоль единственного в Крыму вулкана. Скалы, сердолик, Золотые ворота, легенды о входе в Аид и Карадагском змее. А после — поднимаемся на гору, где начиналась космонавтика. Тот самый Узун-Сырт, где Королёв запускал первые планеры, где Волошин с Арциуловым случайно открыли воздушные потоки, подбросив шляпу. 88 космонавтов приезжали сюда перед полётом. Высота 400 метров — Карадаг видно как на ладони. Море, горы, космос — за один день»</blockquote>`,

  tourist: `<ul>
<li>🧢 Шапочка и вода обязательны. На катере вода дороже — возьмите с собой.</li>
<li>🚾 На катере есть туалет.</li>
<li>🩱 Купальник с собой — будем купаться в открытом море.</li>
<li>🚤 Маленький катер лучше — проходит под Золотыми воротами. Но если группа большая — большой.</li>
<li>🥾 Гора Узун-Сырт — 400 м подъёма. Обувь удобная, без каблуков.</li>
<li>🤢 Если боитесь высоты или укачивания — предупредите гида. Обычно все переносят хорошо.</li>
</ul>`,

  org: `<ul>
<li>📌 Начинается из Орджоникидзе.</li>
<li>⏱️ Катер — 2 часа, потом гора.</li>
<li>👥 Катер 40–60 мест.</li>
<li>🔄 Последовательность может меняться в зависимости от погоды (обычно море → гора).</li>
<li>🎯 Узун-Сырт входит также в «Семь чудес Киммерии» — учтите при комбинировании.</li>
</ul>`
});

add('avtopesh', 'Автопешеходная по Феодосии', 'yugo-vostok', '🏛️', {
  time: '⏰ ~3–4 ч · Лучше сб–вс',

  desc: `<p>Полудневная пешеходная экскурсия по Феодосии — одному из древнейших городов мира (более 2500 лет). Маршрут соединяет античность, средневековье и XIX век: гора Митридат, Генуэзская крепость, храмы с фресками Феофана Грека, Екатерининская улица. Лучшее время — суббота или воскресенье, когда открыты все храмы.</p>`,

  why: `<p>«<strong>Местные приезжают — и в восторге</strong>», — говорит Наташа. Феодосия — не просто курорт, это город, где каждый камень дышит историей.</p>

<li><strong>Памятник Афанасию Никитину</strong> — «хождение за три моря». Жил в Феодосии 3 месяца, молился в одном из храмов.</li>
<li><strong>Улица Екатерининская</strong> — история города XIX века.</li>
<li><strong>Памятник Пушкину</strong> и музей древностей 1812 года.</li>
</ol>`,

  sell: `<blockquote>«Вы знали, что Феодосии больше 2500 лет? Она старше многих европейских столиц. Поднимемся на гору Митридат — город как на ладони. Пройдём по Генуэзской крепости, где в четырёх храмах — фрески Феофана Грека, живые, подлинные. Могила Айвазовского, мечеть XVII века, памятник Афанасию Никитину. Екатерининская улица — как машина времени: XIX век, купеческие дома. Лучше всего в субботу-воскресенье — открыты все храмы. Это не скучная лекция — это прогулка по живому музею под открытым небом. Полдня — и вы влюбитесь в Феодосию». </blockquote>`,

  tourist: `<ul>

// ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====

function esc(t) {
  return t.replace(/[&<>"]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    if (m === '"') return '&quot;';
    return m;
  });
}

function renderCard(e) {
  return `<div class="card" id="card-${e.id}" data-cat="${e.cat}">
    <h2>${e.emoji} ${esc(e.title)}</h2>
    <div class="meta"><span>${e.time}</span><span>${e.price}</span><span>${e.type}</span></div>

    <h3>📋 Что это?</h3>
    ${e.desc}

    <h3>💎 Почему клиент это купит?</h3>
    ${e.why}

    <h3>🎣 Главные продающие «крючки»</h3>
    ${e.hooks}

    <h3>🗣️ Как продать за 30 секунд</h3>
    ${e.sell}

    <h3>⚠️ Что обязательно сказать туристу</h3>
    <div class="highlight">${e.tourist}</div>

    <h3>📌 Нюансы для реализатора (из опыта)</h3>
    ${e.org}
  </div>`;
}

function renderButton(e) {
  const catNames = {
    'yugo-vostok': '🌊Юго-Восток', 'obzornye': '🌄Обзорная', 'dvortsy': '🏰Дворцы',
    'aktiv': '🏔Активная', 'peshery': '🕯️Пещеры', 'vinnye': '🍷Винный',
    'palomnicheskie': '⛪Паломн.', 'zapad': '🏖Запад', 'sevastopol': '⚓Севаст.',
    'kerch': '🏛Керчь', 'semejnye': '🐾Семья', 'fototur': '📸Фото'
  };
  const tag = catNames[e.cat] || '';
  return `<button class="sidebar-btn" data-id="${e.id}" data-cat="${e.cat}">${e.emoji} ${esc(e.title)} ${tag ? `<span class="cat-tag">${tag}</span>` : ''}</button>`;
}

// ===== ИНИЦИАЛИЗАЦИЯ =====
document.addEventListener('DOMContentLoaded', function() {
  const sidebar = document.getElementById('sidebar');
  const content = document.getElementById('content');
  const placeholder = document.getElementById('placeholder');

  // Сортируем: сначала наши детальные, потом остальные
  const detailIds = ['sudak-ns', 'automorskoy', 'avtopesh', 'vecherniy-ns', 'sem-chudes', 'puteshestvie', 'vinny-sd', 'massandra', 'peshery'];

  // Рендерим кнопки
  excursions.sort((a, b) => {
    const ai = detailIds.indexOf(a.id);
    const bi = detailIds.indexOf(b.id);
    if (ai !== -1 && bi !== -1) return ai - bi;
    if (ai !== -1) return -1;
    if (bi !== -1) return 1;
    return a.title.localeCompare(b.title);
  });

  let btnHtml = '';
  excursions.forEach(e => { btnHtml += renderButton(e); });
  sidebar.insertAdjacentHTML('beforeend', btnHtml);

  // Рендерим карточки
  let cardHtml = '';
  excursions.forEach(e => { cardHtml += renderCard(e); });
  content.insertAdjacentHTML('beforeend', cardHtml);

  // Клик по кнопке
  document.querySelectorAll('.sidebar-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const id = this.dataset.id;

      document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');

      document.querySelectorAll('.card').forEach(c => c.classList.remove('visible'));
      placeholder.style.display = 'none';

      const card = document.getElementById('card-' + id);
      if (card) {
        card.classList.add('visible');
        // скролл к карточке на мобильных
        if (window.innerWidth <= 900) {
          card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    });
  });

  // Фильтр по категориям
  document.querySelectorAll('#catNav button').forEach(btn => {
    btn.addEventListener('click', function() {
      const cat = this.dataset.cat;

      document.querySelectorAll('#catNav button').forEach(b => b.classList.remove('active'));
      this.classList.add('active');

      document.querySelectorAll('.sidebar-btn').forEach(b => {
        if (cat === 'all' || b.dataset.cat === cat) {
          b.style.display = 'block';
        } else {
          b.style.display = 'none';
        }
      });

      // Если активная карточка не видна — показываем плейсхолдер
      const activeBtn = document.querySelector('.sidebar-btn.active');
      if (activeBtn && activeBtn.style.display === 'none') {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('visible'));
        placeholder.style.display = 'block';
        document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
      }
    });
  });

  // Открываем первую по умолчанию
  const firstBtn = document.querySelector('.sidebar-btn');
  if (firstBtn) firstBtn.click();
});
</script>
