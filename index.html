// ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====

function esc(t) {
  return t.replace(/[&<>"]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    if (m === '"') return '&quot;';
    return m;
  });
}

function renderCard(e) {
  return `<div class="card" id="card-${e.id}" data-cat="${e.cat}">
    <h2>${e.emoji} ${esc(e.title)}</h2>
    <div class="meta"><span>${e.time}</span><span>${e.price}</span><span>${e.type}</span></div>

    <h3>📋 Что это?</h3>
    ${e.desc}

    <h3>💎 Почему клиент это купит?</h3>
    ${e.why}

    <h3>🎣 Главные продающие «крючки»</h3>
    ${e.hooks}

    <h3>🗣️ Как продать за 30 секунд</h3>
    ${e.sell}

    <h3>⚠️ Что обязательно сказать туристу</h3>
    <div class="highlight">${e.tourist}</div>

    <h3>📌 Нюансы для реализатора (из опыта)</h3>
    ${e.org}
  </div>`;
}

function renderButton(e) {
  const catNames = {
    'yugo-vostok': '🌊Юго-Восток', 'obzornye': '🌄Обзорная', 'dvortsy': '🏰Дворцы',
    'aktiv': '🏔Активная', 'peshery': '🕯️Пещеры', 'vinnye': '🍷Винный',
    'palomnicheskie': '⛪Паломн.', 'zapad': '🏖Запад', 'sevastopol': '⚓Севаст.',
    'kerch': '🏛Керчь', 'semejnye': '🐾Семья', 'fototur': '📸Фото'
  };
  const tag = catNames[e.cat] || '';
  return `<button class="drawer-btn" data-id="${e.id}" data-cat="${e.cat}">${e.emoji} ${esc(e.title)} ${tag ? `<span class="cat-tag">${tag}</span>` : ''}</button>`;
}

// ===== УПРАВЛЕНИЕ ШТОРКОЙ =====
function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function openDrawerRight() {
  document.getElementById('drawerRight').classList.add('open');
  document.getElementById('drawerOverlayRight').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDrawerRight() {
  document.getElementById('drawerRight').classList.remove('open');
  document.getElementById('drawerOverlayRight').classList.remove('open');
  document.body.style.overflow = '';
}

// ===== ИНИЦИАЛИЗАЦИЯ =====
document.addEventListener('DOMContentLoaded', function() {
  const drawerList = document.getElementById('drawerList');
  const drawerCatList = document.getElementById('drawerCatList');
  const content = document.getElementById('content');
  const placeholder = document.getElementById('placeholder');

  // Сортируем
  const detailIds = ['sudak-ns', 'automorskoy', 'avtopesh', 'vecherniy-ns', 'sem-chudes', 'puteshestvie', 'vinny-sd', 'massandra', 'peshery', 'solnechniy-krug', 'rayskiy-ugolok', 'yubk', 'tri-dvorca', 'krymskie-maldivy', 'kimmeriyskie-berega', 'sakralny-krym', 'zavtrak-u-zufara'];
  excursions.sort((a, b) => {
    const ai = detailIds.indexOf(a.id);
    const bi = detailIds.indexOf(b.id);
    if (ai !== -1 && bi !== -1) return ai - bi;
    if (ai !== -1) return -1;
    if (bi !== -1) return 1;
    return a.title.localeCompare(b.title);
  });

  // Рендерим кнопки в левой шторке
  let btnHtml = '';
  excursions.forEach(e => { btnHtml += renderButton(e); });
  drawerList.insertAdjacentHTML('beforeend', btnHtml);

  // Рендерим карточки
  let cardHtml = '';
  excursions.forEach(e => { cardHtml += renderCard(e); });
  content.insertAdjacentHTML('beforeend', cardHtml);

  // Рендерим кнопки категорий в правой шторке
  const categories = [
    { cat: 'all', label: '🏁 Все' },
    { cat: 'yugo-vostok', label: '🌊 Юго-Восток' },
    { cat: 'obzornye', label: '🌄 Обзорные' },
    { cat: 'dvortsy', label: '🏰 Дворцы & ЮБК' },
    { cat: 'aktiv', label: '🏔 Активные' },
    { cat: 'peshery', label: '🕯️ Пещеры' },
    { cat: 'vinnye', label: '🍷 Винные' },
    { cat: 'palomnicheskie', label: '⛪ Паломнические' },
    { cat: 'zapad', label: '🏖 Западный Крым' },
    { cat: 'sevastopol', label: '⚓ Севастополь' },
    { cat: 'kerch', label: '🏛 Керчь' },
    { cat: 'semejnye', label: '🐾 Семейные' },
    { cat: 'fototur', label: '📸 Фототуры' }
  ];
  let catHtml = '';
  categories.forEach(c => {
    catHtml += `<button class="cat-filter-btn ${c.cat === 'all' ? 'active' : ''}" data-cat="${c.cat}">${c.label}</button>`;
  });
  drawerCatList.insertAdjacentHTML('beforeend', catHtml);

  // Текущий фильтр
  let currentCat = 'all';

  // Левая кнопка-бургер — открыть левую шторку
  document.getElementById('hamburgerLeft').addEventListener('click', openDrawer);

  // Правая кнопка-бургер — открыть правую шторку
  document.getElementById('hamburgerRight').addEventListener('click', openDrawerRight);

  // Оверлей левой шторки — закрыть
  document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);

  // Оверлей правой шторки — закрыть
  document.getElementById('drawerOverlayRight').addEventListener('click', closeDrawerRight);

  // Крестик левой шторки — закрыть
  document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);

  // Крестик правой шторки — закрыть
  document.getElementById('drawerCloseRightBtn').addEventListener('click', closeDrawerRight);

  // Клик по кнопке в левой шторке
  document.querySelectorAll('.drawer-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const id = this.dataset.id;

      document.querySelectorAll('.drawer-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');

      document.querySelectorAll('.card').forEach(c => c.classList.remove('visible'));
      placeholder.style.display = 'none';

      const card = document.getElementById('card-' + id);
      if (card) {
        card.classList.add('visible');
        if (window.innerWidth <= 900) {
          card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      closeDrawer();
    });
  });

  // Фильтр по категориям (правая шторка)
  document.querySelectorAll('.cat-filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const cat = this.dataset.cat;
      currentCat = cat;

      document.querySelectorAll('.cat-filter-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');

      // Фильтруем кнопки в левой шторке
      document.querySelectorAll('.drawer-btn').forEach(b => {
        if (cat === 'all' || b.dataset.cat === cat) {
          b.style.display = 'block';
        } else {
          b.style.display = 'none';
        }
      });

      // Если активная экскурсия скрыта фильтром — сбрасываем
      const activeBtn = document.querySelector('.drawer-btn.active');
      if (activeBtn && activeBtn.style.display === 'none') {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('visible'));
        placeholder.style.display = 'block';
        document.querySelectorAll('.drawer-btn').forEach(b => b.classList.remove('active'));
      }

      closeDrawerRight();
    });
  });

  // Открываем первую по умолчанию
  const firstBtn = document.querySelector('.drawer-btn');
  if (firstBtn) firstBtn.click();
});
</script>
</body>
</html>
